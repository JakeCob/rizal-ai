# Lesson 7: Fishing.
#
# Scene: Chapter 23, the cayman. At the fish corral on the lake, Leon finds
# that nobody has checked it in five days and feels something big below:
# not sand but cayman hide, the posts shaking. Sinang wants to tie it to the
# banca and drag it home; Maria Clara has never seen a live one. The pilot
# takes a long rope and jumps into the pen; Ibarra offers his knife as the
# water closes over him. The old boatman calms the ladies: they call him the
# Pilot, the best he has seen. The cayman breaks loose and drags the pilot
# under, Ibarra dives in, the water turns red, and both surface holding the
# dead cayman. The pilot tells Ibarra he owes him his life.
#
# Speaker labels. The pilot is labelled Piloto (and called "the pilot" in
# narration) in this lesson and Elias from chapter 24 on. This is a recorded
# exception to the same-label norm, by the owner's ruling: the novel
# withholds his name until chapter 24, and every pinned edition here says
# "the pilot". His one line is quoted inside the narrated last beat, the way
# lesson 6 quotes Ibarra, because the beat also carries the dive and the
# surfacing. Matandang bangkero follows the Matandang alila pattern.
#
# Sensitivity. The blood is stated plainly in one clause (b8), as chapter
# 10's hanging was. The sagip group pins es 138 to 140, tl 137 to 139 and
# en 103 and 104. es 139 / tl 138 (inside en 103) carry the dive and also
# Rizal's aside that Filipino women do not yet know how to swoon; the
# vignette does not carry that sentence.
#
# The vignette below is our own modern Tagalog adaptation (DECISIONS.md
# D01). It is not Rizal's text and never carries his byline. The originals,
# in Spanish, Poblete's 1909 Tagalog, and Derbyshire's English, are pinned
# under source_passages and shown verbatim on the "In Rizal's voice" card.
# Refs sharing a group are the same passage in different editions, aligned
# by content. es and tl share numbers for 108 to 124; Poblete leaves out es
# 125 (only Maria Clara had noticed the pilot), so from es 126 his numbers
# run one behind (es 126 is tl 125, es 143 is tl 142). Derbyshire merges es
# 116 and 117 (his 88), es 124 to 126 (95), es 127 and 128 (96), es 138 and
# 139 (103) and es 142 to 144 (106). Never pin tl 23:82 or 23:84 (section
# breaks) or anything past tl 23:160.

