vignette:
  - line_id: b1
    speaker: "Leon"
    tl: "Limang araw nang walang sumisilip sa baklad? Siguradong may malaking nahuli rito, kung hindi engkantado ang lawa."
    en: "Nobody has checked the corral in five days? Then something big is caught in here, unless the lake is enchanted."
    exercise_after: ex1
  - line_id: b2
    speaker: "Leon"
    tl: "Balat ng buwaya ang tinatamaan ko, hindi buhangin! Tingnan n'yo, gumagalaw ang mga poste. Ang laki niya!"
    en: "What I'm hitting is cayman hide, not sand! Look, the posts are moving. It's huge!"
    exercise_after: ex2
  - line_id: b3
    speaker: "Sinang"
    tl: "Dalhin natin siya pauwi, nakatali sa bangka! Ang kapal ng mukha niya, kinain ang mga isda natin!"
    en: "Let's take it home, tied to the banca! The nerve of it, eating our fish!"
    exercise_after: ex3
  - line_id: b4
    speaker: "Maria Clara"
    tl: "Ngayon lang ako makakakita ng buhay na buwaya."
    en: "This is the first time I'll see a live cayman."
    exercise_after: ex4
  - line_id: b5
    speaker: null
    tl: "Biglang tumayo ang piloto. May dala na siyang mahabang lubid nang umakyat siya sa plataporma, at walang sabi-sabing tumalon siya sa baklad. Napasigaw ang lahat."
    en: "Suddenly the pilot stood up. He had a long rope with him when he climbed onto the platform, and without a word he jumped into the pen. Everyone cried out."
    exercise_after: ex5
  - line_id: b6
    speaker: "Ibarra"
    tl: "Sandali! Kunin mo ang kutsilyo ko!"
    en: "Wait! Take my knife!"
    exercise_after: ex6
  - line_id: b7
    speaker: "Matandang bangkero"
    tl: "Kalma lang po kayo, mga binibini. Piloto ang tawag namin sa kanya, at wala pa akong nakitang mas magaling."
    en: "Stay calm, ladies. We call him the Pilot, and I've never seen anyone better."
    exercise_after: ex7
  - line_id: b8
    speaker: null
    tl: 'Nakawala ang buwaya at hinila pailalim ang piloto. Parang kidlat, tumalon si Ibarra sa tubig. Namula sa dugo ang tubig, pero lumitaw silang dalawa na hawak ang patay na buwaya. "Kung hindi po dahil sa inyo, patay na ako," ang nasabi ng piloto.'
    en: 'The cayman broke loose and dragged the pilot under. Quick as lightning, Ibarra dove into the water. The water turned red with blood, but the two of them surfaced holding the dead cayman. "If it weren''t for you, sir, I''d be dead," was all the pilot could say.'
    exercise_after: ex8

