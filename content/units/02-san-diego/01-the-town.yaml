vignette:
  - line_id: b1
    speaker: null
    tl: "Malapit sa lawa ang bayan ng San Diego, napapaligiran ng mga bukid at palayan. Kilala ito sa asukal, bigas, kape, at prutas."
    en: "The town of San Diego lies near the lake, surrounded by fields and rice paddies. It is known for sugar, rice, coffee and fruit."
    exercise_after: ex1
  - line_id: b2
    speaker: null
    tl: "Sa gitna ng mga bukid, may isang lumang gubat. Iginagalang ito ng buong bayan."
    en: "In the middle of the fields stands an old wood. The whole town respects it."
    exercise_after: ex2
  - line_id: b3
    speaker: null
    tl: "Noong unang panahon, isang matandang Kastila na magaling mag-Tagalog ang bumili ng gubat. Isang araw, bigla siyang nawala. Nang matagpuan siya, nakabigti na siya sa isang puno ng balete."
    en: "Long ago, an old Spaniard who spoke Tagalog well bought the wood. One day he suddenly disappeared. When he was found, he had hanged himself from a balete tree."
    exercise_after: ex3
  - line_id: b4
    speaker: null
    tl: "Ang mga alahas niya, inihagis ng mga babae sa ilog. Ang mga damit niya, sinunog nila. Mula noon, wala nang lumalapit sa puno."
    en: "The women threw his jewels into the river and burned his clothes. From then on, nobody went near the tree."
    exercise_after: ex4
  - line_id: b5
    speaker: null
    tl: "Sabi ng iba, may nakikitang ilaw at naririnig na daing doon kapag gabi. May binatang nagpalipas ng isang gabi sa ilalim ng puno, at namatay siya sa lagnat kinabukasan."
    en: "Some say lights are seen and moans are heard there at night. A young man once spent a night under the tree, and he died of a fever the next day."
    exercise_after: ex5
  - line_id: b6
    speaker: null
    tl: "Dumating ang anak ng Kastila, at pinaderan niya ang puntod ng kanyang ama. Nang mag-asawa siya, nagkaanak sila: si Don Rafael, ang ama ni Ibarra."
    en: "The Spaniard's son came and built a wall around his father's grave. When he married, they had a son: Don Rafael, Ibarra's father."
    exercise_after: ex6
  - line_id: b7
    speaker: null
    tl: "Hanggang ngayon, kapag may batong biglang nahuhulog habang namimitas ng bayabas ang mga bata, nagtatakbuhan sila palabas ng gubat. May namumutla, may umiiyak, at may tumatawa."
    en: "To this day, when a stone suddenly falls while the boys are picking guavas, they all run out of the wood. Some go pale, some cry, and some laugh."
    exercise_after: ex7
  - line_id: b8
    speaker: "Mga bata"
    tl: "Nandiyan na ang matanda! Takbo!"
    en: "The old man is here! Run!"
    exercise_after: ex8

