# Lesson 5: The town.
#
# Scene: Chapter 10. San Diego lies by the lake among fields and rice
# paddies. Beside the fields is an old wood the whole town respects. Long
# ago an old Spaniard who spoke Tagalog well bought it, vanished, and was
# found hanging from a balete. The women threw his jewels into the river and
# burned his clothes, and nobody went near the tree again; people tell of
# lights and moans, and of a young man who spent a night there and died of
# fever. His son walled in the grave and married; their son was Don Rafael,
# Ibarra's father. Boys picking guavas still run when a stone falls from
# nowhere, crying that the old man is there.
#
# Chapter 10 has no dialogue except the boys' cry, so the lesson is
# narrator-led: seven beats with speaker null (the lesson 3 precedent) and
# the boys' cry as the eighth. The hanging is stated plainly in one clause.
#
# The vignette below is our own modern Tagalog adaptation (DECISIONS.md
# D01). It is not Rizal's text and never carries his byline. The originals,
# in Spanish, Poblete's 1909 Tagalog, and Derbyshire's English, are pinned
# under source_passages and shown verbatim on the "In Rizal's voice" card.
# Refs sharing a group are the same passage in different editions, aligned
# by content. Spanish and Tagalog run one to one for paragraphs 1 to 7.
# Derbyshire merges es 4 and 5 into his 4, so the legend group carries two
# Spanish and two Tagalog rows against one English row; from there he runs
# one behind (es 6 is his 5, the second half of es 7 is his 6). The town
# group pins es/tl/en 1, which ends with a clause about Chinese merchants;
# the vignette line stops at the crops. Poblete's rows past tl 10:7 are a
# footnote header and footnotes and are never pinned.

