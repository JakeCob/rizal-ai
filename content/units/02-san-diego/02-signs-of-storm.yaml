# Lesson 6: Signs of storm.
#
# Scene: Chapter 13. A dusty carriage stops at the San Diego cemetery and
# Ibarra walks in with an old servant. The servant explains that illness
# kept him away, that he planted flowers and set up a cross he carved
# himself, behind the big cross. There is no cross anywhere, and the grave
# looks dug up. The grave-digger asks whether it was a big carved cross tied
# with rattan, then, yawning, says he burned it on the fat curate's orders,
# the curate who beats people with a cane. The same curate had him dig up
# the body and move it to the Chinese cemetery, but it was heavy and the
# rain was pouring. Seized by Ibarra and frightened, he admits he threw the
# body into the lake. Ibarra grips his shoulders, stares at him, calls him a
# wretch, and leaves across the graves like a man beside himself.
#
# The grave-digger's comparison about the Chinese cemetery (es and tl 13:38,
# en 13:28) is never pinned and has no counterpart in the vignette; the lake
# group pins the exhumation paragraph instead (es and tl 13:35, en 13:26).
#
# The vignette below is our own modern Tagalog adaptation (DECISIONS.md
# D01). It is not Rizal's text and never carries his byline. The originals,
# in Spanish, Poblete's 1909 Tagalog, and Derbyshire's English, are pinned
# under source_passages and shown verbatim on the "In Rizal's voice" card.
# The dug group (es and tl 13:31, en 13:22) is pinned without a beat of its
# own: the vignette steps around "the dead man is no longer there" to keep
# clear of the tl 13:31 trap line, and b6 goes straight to the exhumation.
# Ibarra seizing and shaking the grave-digger (es 13:36 to 37) is implied
# between b6 and b7, because both beats are the grave-digger speaking; b7's
# "huwag n'yo po akong saktan" carries it.
#
# Refs sharing a group are the same passage in different editions, aligned
# by content. Spanish and Tagalog run one to one for 13:1 to 13:57.
# Derbyshire merges often (es 1 and 2 are his 1, es 3 to 5 his 2, es 22 and
# 23 his 16, es 30 and 31 his 22, es 39 and 40 his 29), so his numbers run
# well behind. Poblete's rows past tl 13:57 are a caption, a footnote header
# and a footnote and are never pinned.

