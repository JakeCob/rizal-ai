vignette:
  - line_id: b1
    speaker: null
    tl: "Huminto ang isang maalikabok na karwahe sa may libingan. Bumaba si Ibarra, kasama ang isang matandang alila."
    en: "A dusty carriage stopped near the cemetery. Ibarra got out with an old servant."
    exercise_after: ex1
  - line_id: b2
    speaker: "Matandang alila"
    tl: "Pasensya na po, nagkasakit ako kaya hindi ako nakabalik agad. Nagtanim po ako ng mga bulaklak doon at naglagay ng krus na ako mismo ang umukit. Nasa likuran po iyon ng malaking krus."
    en: "I'm sorry, sir, I fell ill, so I couldn't come back sooner. I planted flowers there and put up a cross I carved myself. It's behind the big cross."
    exercise_after: ex2
  - line_id: b3
    speaker: null
    tl: "Pero pagdating nila roon, walang krus kahit saan. Mukhang may naghukay sa puntod."
    en: "But when they got there, there was no cross anywhere. It looked as if someone had dug up the grave."
    exercise_after: ex3
  - line_id: b4
    speaker: "Tagapaglibing"
    tl: "Iyon po bang malaking krus na may ukit at nakatali ng yantok? Ay, ako po ang nagsunog no'n. Utos ng kurang mataba."
    en: "You mean the big carved cross tied with rattan? Oh, I was the one who burned it. The fat curate's orders."
    exercise_after: ex4
  - line_id: b5
    speaker: "Ibarra"
    tl: "Sinong kura 'yan?"
    en: "Which curate is that?"
    exercise_after: ex5
  - line_id: b6
    speaker: "Tagapaglibing"
    tl: "Iyong namamalo po ng tungkod. Siya rin po ang nag-utos na hukayin ko ang bangkay at ilipat sa sementeryo ng mga Tsino. Kaso ang bigat, tapos bumubuhos pa ang ulan."
    en: "The one who hits people with a cane. He's also the one who told me to dig up the body and move it to the Chinese cemetery. But it was so heavy, and the rain was pouring down."
    exercise_after: ex6
  - line_id: b7
    speaker: "Tagapaglibing"
    tl: "Teka po, huwag n'yo po akong saktan! Sa lawa ko na lang po itinapon."
    en: "Wait, please don't hurt me! I just threw it into the lake."
    exercise_after: ex7
  - line_id: b8
    speaker: null
    tl: 'Hinawakan ni Ibarra sa balikat ang tagapaglibing at matagal niya itong tiningnan. "Wala kang kwentang tao!" Pagkatapos, nagmamadali siyang lumayo, tinatapakan na ang mga puntod, parang wala sa sarili.'
    en: 'Ibarra took the grave-digger by the shoulders and looked at him for a long time. "You are nothing but a wretch!" Then he hurried away, trampling over the graves, like a man beside himself.'
    exercise_after: ex8

