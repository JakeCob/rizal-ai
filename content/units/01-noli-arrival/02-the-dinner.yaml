vignette:
  - line_id: b1
    speaker: null
    tl: "Umupo na ang mga bisita. Parehong pumunta sa kabisera ang dalawang pari."
    en: "The guests sat down. Both priests went to the head of the table."
    exercise_after: ex1
  - line_id: b2
    speaker: "Kapitan Tiago"
    tl: "Diyan lang po kayo, huwag na po kayong tumayo! Nagpaluto ako ng tinola para sa inyo."
    en: "Stay where you are, don't get up! I had tinola cooked for you."
    exercise_after: ex2
  - line_id: b3
    speaker: null
    tl: "Napunta kay Padre Damaso ang leeg at pakpak ng manok."
    en: "Padre Damaso ended up with the neck and the wing of the chicken."
    exercise_after: ex3
  - line_id: b4
    speaker: null
    tl: "Itinulak niya ang plato. Galit na galit siya pero hindi siya nagsalita."
    en: "He pushed the plate away. He was furious, but he said nothing."
    exercise_after: ex4
  - line_id: b5
    speaker: "Padre Damaso"
    tl: "Iyan lang ba ang natutunan mo sa Europa? Kahit batang nag-aaral pa lang, alam na 'yan!"
    en: "Is that all you learned in Europe? Even a schoolkid knows that!"
    exercise_after: ex5
  - line_id: b6
    speaker: "Ibarra"
    tl: "Mga ginoo, ganyan na po talaga ako tratuhin ni Padre Damaso mula noong bata pa ako."
    en: "Gentlemen, Padre Damaso has treated me like this ever since I was a child."
    exercise_after: ex6
  - line_id: b7
    speaker: "Ibarra"
    tl: "Pasensya na po, kailangan ko nang umalis. Marami pa akong aasikasuhin."
    en: "Excuse me, I have to leave now. I still have a lot to take care of."
    exercise_after: ex7
  - line_id: b8
    speaker: "Kapitan Tiago"
    tl: "Teka lang po, huwag muna kayong umalis! Papunta na si Maria Clara."
    en: "Wait a moment, don't go yet! Maria Clara is on her way."
    exercise_after: ex8

