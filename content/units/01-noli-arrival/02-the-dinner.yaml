# Lesson 2: The Dinner.
#
# Scene: Chapter 3. The two friars both head for the head of the table,
# Capitan Tiago keeps Ibarra seated and has tinola served in his honor,
# Padre Damaso is served the neck and a tough wing and pushes his plate
# away, then sneers that Ibarra wasted his fortune in Europe to learn what
# any schoolboy knows. Ibarra answers with restraint, drinks a toast and
# leaves; Capitan Tiago begs him to stay. After he goes, Damaso blames the
# habit of sending young men to Europe.
#
# The vignette below is our own modern Tagalog adaptation (DECISIONS.md
# D01). It is not Rizal's text and never carries his byline. The originals,
# in Spanish, Poblete's 1909 Tagalog, and Derbyshire's English, are pinned
# under source_passages and shown verbatim on the "In Rizal's voice" card.
# Refs sharing a group are the same passage in three editions, aligned by
# content (Derbyshire merges short paragraphs: his 13 holds the Spanish 13
# and 14, so from Spanish paragraph 14 on his numbering runs one to eight
# behind the Spanish and Tagalog). Ibarra's toast and Damaso's outburst after
# he leaves appear only as pinned passages (groups leave and pride), not as
# beats. The vignette uses spoken modern forms (natutunan, pasensya) where
# KWF prefers natutuhan and pasensiya.

