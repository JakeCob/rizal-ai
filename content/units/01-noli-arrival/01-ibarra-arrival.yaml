vignette:
  - line_id: b1
    speaker: null
    tl: "Pumasok sa sala si Kapitan Tiago kasama ang isang binata."
    en: "Capitan Tiago came into the sala with a young man."
  - line_id: b2
    speaker: "Kapitan Tiago"
    tl: "Ipinakikilala ko sa inyo si Don Crisostomo Ibarra, ang anak ng yumao kong kaibigan."
    en: "I present to you Don Crisostomo Ibarra, the son of my late friend."
    exercise_after: ex1
  - line_id: b3
    speaker: "Kapitan Tiago"
    tl: "Kararating pa lang niya mula sa Europa."
    en: "He has only just arrived from Europe."
    exercise_after: ex2
  - line_id: b4
    speaker: null
    tl: "Iniabot ni Ibarra ang kanyang kamay kay Padre Damaso, pero hindi ito tinanggap ng pari."
    en: "Ibarra held out his hand to Padre Damaso, but the priest did not take it."
    exercise_after: ex3
  - line_id: b5
    speaker: "Tenyente"
    tl: "Binata, ikaw ba ang anak ni Don Rafael Ibarra?"
    en: "Young man, are you the son of Don Rafael Ibarra?"
    exercise_after: ex4
  - line_id: b6
    speaker: "Ibarra"
    tl: "Opo. Salamat po sa inyong papuri sa aking ama."
    en: "Yes, sir. Thank you for your praise of my father."
    exercise_after: ex5
  - line_id: b7
    speaker: "Kapitan Tinong"
    tl: "Ginoong Ibarra, kumain kayo sa amin bukas!"
    en: "Señor Ibarra, come and eat with us tomorrow!"
    exercise_after: ex6
  - line_id: b8
    speaker: "Ibarra"
    tl: "Salamat po, pero bukas ay aalis ako patungong San Diego."
    en: "Thank you, but tomorrow I leave for San Diego."
    exercise_after: ex7

