# Lesson 1: Ibarra arrives at Capitan Tiago's dinner.
#
# Scene: Rizal closes Chapter 1 with two figures entering the sala and opens
# Chapter 2 with Capitan Tiago presenting Don Crisostomo Ibarra, Padre
# Damaso refusing his hand, the lieutenant asking whether he is Don Rafael's
# son and praising the father, and Capitan Tinong inviting him to dinner.
#
# The vignette below is our own modern Tagalog adaptation (DECISIONS.md
# D01). It is not Rizal's text and never carries his byline. The originals,
# in Spanish, Poblete's 1909 Tagalog, and Derbyshire's English, are pinned
# under source_passages and shown verbatim on the "In Rizal's voice" card.
# Refs sharing a group are the same passage in three editions, aligned by
# content (English paragraph numbers differ because Derbyshire merges
# paragraphs).

