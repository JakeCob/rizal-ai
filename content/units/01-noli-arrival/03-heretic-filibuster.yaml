# Lesson 3: Heretic and Filibuster.
#
# Scene: Chapter 4. Ibarra walks through Binondo at night and Teniente
# Guevara catches up with him. Ibarra asks how his father died; Guevara
# tells him Don Rafael died in prison, buried in his town almost a year ago.
# A tax collector who could not read struck a schoolboy, Don Rafael pushed
# him, the man fell against a stone and died. Don Rafael was jailed, his
# enemies called him a heretic and a filibuster, and he died alone just
# before he would have been acquitted. Ibarra shakes the lieutenant's hand
# in silence and leaves.
#
# The vignette below is our own modern Tagalog adaptation (DECISIONS.md
# D01). It is not Rizal's text and never carries his byline. The originals,
# in Spanish, Poblete's 1909 Tagalog, and Derbyshire's English, are pinned
# under source_passages and shown verbatim on the "In Rizal's voice" card.
# Refs sharing a group are the same passage in three editions, aligned by
# content. Poblete inserts an illustration caption as paragraph 23, so from
# there his numbering runs one ahead of the Spanish; Derbyshire merges and
# splits paragraphs, so his numbering drifts further (the Spanish paragraph
# 33 is his 25 and 26, both pinned in the incident group).

