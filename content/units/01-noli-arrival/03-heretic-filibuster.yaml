vignette:
  - line_id: b1
    speaker: null
    tl: "Noong gabing iyon, naglakad si Ibarra sa Binondo. Doon siya inabutan ni Tenyente Guevara."
    en: "That night, Ibarra walked through Binondo. There Teniente Guevara caught up with him."
    exercise_after: ex1
  - line_id: b2
    speaker: "Ibarra"
    tl: "Tenyente, paano po namatay ang aking ama?"
    en: "Teniente, how did my father die?"
    exercise_after: ex2
  - line_id: b3
    speaker: "Tenyente"
    tl: "Hindi mo ba alam? Sa kulungan siya namatay."
    en: "Don't you know? He died in jail."
    exercise_after: ex3
  - line_id: b4
    speaker: "Tenyente"
    tl: "Noon, may maniningil ng buwis na hindi marunong magbasa. Sinaktan niya ang isang batang estudyante."
    en: "Back then, there was a tax collector who could not read. He hurt a schoolboy."
    exercise_after: ex4
  - line_id: b5
    speaker: "Tenyente"
    tl: "Itinulak siya ng iyong ama, kaya natumba ang lalaki. Tumama ang ulo niya sa bato, at namatay siya."
    en: "Your father pushed him, so the man fell. His head hit a stone, and he died."
    exercise_after: ex5
  - line_id: b6
    speaker: "Tenyente"
    tl: "Dahil doon, ikinulong ang ama mo. Tinawag siyang erehe at pilibustero ng mga kaaway niya."
    en: "Because of that, your father was jailed. His enemies called him a heretic and a filibuster."
    exercise_after: ex6
  - line_id: b7
    speaker: "Tenyente"
    tl: "Malapit na sana siyang mapawalang-sala, pero namatay siyang mag-isa. Halos isang taon na siyang nakalibing sa bayan mo."
    en: "He was about to be acquitted, but he died alone. It has been almost a year since he was buried in your town."
    exercise_after: ex7
  - line_id: b8
    speaker: null
    tl: "Wala nang nasabi si Ibarra. Tahimik niyang kinamayan ang tenyente, saka siya umalis."
    en: "Ibarra had nothing more to say. He quietly shook the teniente's hand, then he left."
    exercise_after: ex8

