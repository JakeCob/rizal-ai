# Lesson 4: An Idyl on an Azotea.
#
# Scene: Chapter 7. Ibarra calls at Capitan Tiago's house in the morning.
# He and Maria Clara slip away to the azotea above the river while Tiya
# Isabel jokes that the whole neighborhood will chaperone them. Maria Clara
# asks whether he always thought of her among the beautiful women of Europe;
# he answers that he could never forget her. She recalls their childhood and
# the sambong leaves she gave him on the way home; he takes the dried leaves
# from his wallet. She brings out the farewell letter he wrote before leaving
# and says she will read it to him, skipping his compliments.
#
# The vignette below is our own modern Tagalog adaptation (DECISIONS.md
# D01). It is not Rizal's text and never carries his byline. The originals,
# in Spanish, Poblete's 1909 Tagalog, and Derbyshire's English, are pinned
# under source_passages and shown verbatim on the "In Rizal's voice" card.
# Refs sharing a group are the same passage in three editions, aligned by
# content. Poblete runs two behind the Spanish for es 23 to 30; his tl 29 is
# an illustration caption, so es 31 is his tl 30; he splits es 32 (the
# childhood memory) into his tl 31 and 32, so the childhood group carries
# both; after that the numbers match again (34, 36, 40). Derbyshire splits
# Ibarra's long reply (es 31) into his 19 to 22; only 19, which opens it, is
# pinned.

