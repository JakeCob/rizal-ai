vignette:
  - line_id: b1
    speaker: null
    tl: "Dumating si Ibarra sa bahay ni Kapitan Tiago. Nag-usap sila ni Maria Clara sa azotea."
    en: "Ibarra arrived at Capitan Tiago's house. He and Maria Clara talked on the azotea."
    exercise_after: ex1
  - line_id: b2
    speaker: "Tiya Isabel"
    tl: "Mabuti pa diyan, kita kayo ng buong kapitbahayan."
    en: "Better there, the whole neighborhood can keep an eye on you."
    exercise_after: ex2
  - line_id: b3
    speaker: "Maria Clara"
    tl: "Lagi mo ba akong naaalala? Ang dami kayang magagandang babae sa Europa!"
    en: "Did you always think of me? There are so many beautiful women in Europe, you know!"
    exercise_after: ex3
  - line_id: b4
    speaker: "Ibarra"
    tl: "Paano kita makakalimutan? Lagi kitang naaalala, mula pa noong mga bata tayo."
    en: "How could I forget you? I have always thought of you, ever since we were kids."
    exercise_after: ex4
  - line_id: b5
    speaker: "Maria Clara"
    tl: "Naaalala mo pa ba? Binigyan kita ng dahon ng sambong para hindi sumakit ang ulo mo."
    en: "Do you still remember? I gave you sambong leaves so your head wouldn't ache."
    exercise_after: ex5
  - line_id: b6
    speaker: "Ibarra"
    tl: "Heto yung mga dahon mo, o. Ito lang kasi ang bigay mo sa akin."
    en: "Here are your leaves, look. This is all you ever gave me, you know."
    exercise_after: ex6
  - line_id: b7
    speaker: "Maria Clara"
    tl: "Uy, huwag mong hawakan! Ito ang sulat mo bago ka umalis."
    en: "Hey, don't touch it! This is the letter you wrote before you left."
    exercise_after: ex7
  - line_id: b8
    speaker: "Maria Clara"
    tl: "Sige, basahin ko na sa iyo, pero hindi ko isasama ang mga bola mo."
    en: "Okay, I'll read it to you now, but I'm leaving out your sweet talk."
    exercise_after: ex8

