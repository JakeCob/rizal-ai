[project]
name = "rizalai"
version = "0.1.0"
description = "RizalAI API: FastAPI backend for the Tagalog and Rizal learning app"
readme = "README.md"
authors = [
    { name = "JakeCob", email = "developer@agileandco.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.6.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.115",
    "fsrs>=6.3.2",
    "httpx>=0.28.1",
    "pgvector>=0.5.0",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.14.0",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
rizalai = "rizalai.cli:main"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "N", "W"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["rizalai"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=rizalai --cov-report=term-missing --cov-fail-under=80"
filterwarnings = ["error::DeprecationWarning:rizalai.*"]

[tool.coverage.run]
source = ["src/rizalai"]
omit = ["src/rizalai/cli.py"]
